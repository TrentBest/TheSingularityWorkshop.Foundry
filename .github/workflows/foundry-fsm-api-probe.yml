name: Foundry FSM_API Probe

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundry-fsm-api-probe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fsm-api-probe:
    name: Build and exercise real FSM_API
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Restore probe
        run: dotnet restore src/Foundry.FsmApiProbe/Foundry.FsmApiProbe.csproj

      - name: Build probe
        run: dotnet build src/Foundry.FsmApiProbe/Foundry.FsmApiProbe.csproj --configuration Release --no-restore

      - name: Execute probe in a fresh process
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          dotnet run --project src/Foundry.FsmApiProbe/Foundry.FsmApiProbe.csproj --configuration Release --no-build 2>&1 | tee artifacts/fsm-api-probe.txt

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundry-fsm-api-probe
          path: artifacts/fsm-api-probe.txt
          if-no-files-found: warn
          retention-days: 14
